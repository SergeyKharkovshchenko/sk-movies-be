spring.application.name=SkMoviesApp
server.port = 8090

spring.web.cors.allowed-origins=https://sk-movies-fe.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# PostgreSQL
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=require
# Small pool: a rolling deploy runs two instances against the same small Postgres, and the default 10
# per instance exhausts its connection slots ("remaining connection slots are reserved ...").
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OMDB
omdb.api.key=${OMDB_API_KEY:cb59d14}

# PageSpeed Insights -- optional; unauthenticated calls work at a lower quota
pagespeed.api.key=${PAGESPEED_API_KEY:}

# OpenAI models per task type
# design  — complex structured output (suggestGraph, RAG chat): needs stronger reasoning
# extract — high-volume simple tasks (suggestSections, triple extraction): cheapest viable model
openai.model.design=${OPENAI_MODEL_DESIGN:gpt-4o-mini}
openai.model.extract=${OPENAI_MODEL_EXTRACT:gpt-4.1-nano}

# TriplyDB mirror of knowledge graphs (one named graph per label) -- disabled when TRIPLY_TOKEN is unset
triply.token=${TRIPLY_TOKEN:}
triply.account=${TRIPLY_ACCOUNT:Kharkovchenko}
triply.dataset=${TRIPLY_DATASET:sk-knowledge}
triply.access-level=${TRIPLY_ACCESS_LEVEL:private}

# Metrics -> Grafana Cloud (OTLP push). Off unless GRAFANA_OTLP_ENABLED=true.
# GRAFANA_OTLP_AUTH = base64("<instanceId>:<glc_ token>") -- without the "Basic " prefix
management.otlp.metrics.export.enabled=${GRAFANA_OTLP_ENABLED:false}
management.otlp.metrics.export.url=${GRAFANA_OTLP_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.headers.Authorization=Basic ${GRAFANA_OTLP_AUTH:}
management.otlp.metrics.export.step=30s
management.opentelemetry.resource-attributes.service.name=sk-movies-be
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoints.web.exposure.include=health

# Traces -> Grafana Cloud (OTLP push). Same auth as metrics.
# GRAFANA_OTLP_TRACES_URL = same gateway as metrics, ending in /v1/traces
management.tracing.enabled=${GRAFANA_OTLP_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${GRAFANA_OTLP_TRACES_URL:http://localhost:4318/v1/traces}
management.otlp.tracing.headers.Authorization=Basic ${GRAFANA_OTLP_AUTH:}

# Grafana Cloud Prometheus (read) -- backs GET /performance/metrics/{panel}. Needs a metrics:read token.
grafana.prom.url=${GRAFANA_PROM_URL:}
grafana.prom.user=${GRAFANA_PROM_USER:}
grafana.prom.token=${GRAFANA_PROM_TOKEN:}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true




